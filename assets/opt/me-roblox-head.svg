<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 70 640 640">
  <!-- Roblox-style blocky avatar of Jeric (original artwork). Head-only crop used as the chat assistant avatar. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d7bb" />
      <stop offset=".55" stop-color="#efc4a0" />
      <stop offset="1" stop-color="#d9a57e" />
    </linearGradient>
    <linearGradient id="skinTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b3326" />
      <stop offset="1" stop-color="#25170f" />
    </linearGradient>
    <linearGradient id="hairShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".16" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b414d" />
      <stop offset=".5" stop-color="#23272f" />
      <stop offset="1" stop-color="#14161b" />
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1e24" />
      <stop offset=".45" stop-color="#2d323b" />
      <stop offset="1" stop-color="#16181d" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d6dbe4" />
    </linearGradient>
    <linearGradient id="tie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0e11" />
      <stop offset=".5" stop-color="#262a31" />
      <stop offset="1" stop-color="#0d0e11" />
    </linearGradient>
  </defs>

  <!-- arms -->
  <rect x="44" y="606" width="142" height="340" rx="36" fill="url(#arm)" />
  <rect x="714" y="606" width="142" height="340" rx="36" fill="url(#arm)" />

  <!-- torso (suit) -->
  <rect x="176" y="584" width="548" height="380" rx="46" fill="url(#suit)" />
  <rect x="176" y="584" width="548" height="40" rx="20" fill="#fff" opacity=".05" />

  <!-- shirt, collar, tie -->
  <path d="M368 584 H532 L450 772 Z" fill="url(#shirt)" />
  <path d="M368 584 L450 632 L414 690 Z" fill="#ffffff" />
  <path d="M532 584 L450 632 L486 690 Z" fill="#e7eaf0" />
  <path d="M430 626 H470 L478 660 L450 678 L422 660 Z" fill="#0f1013" />
  <path d="M434 672 H466 L490 856 L450 902 L410 856 Z" fill="url(#tie)" />

  <!-- lapels -->
  <path d="M368 584 H322 L404 812 L450 772 Z" fill="#2f343d" />
  <path d="M532 584 H578 L496 812 L450 772 Z" fill="#1c1f25" />
  <path d="M322 584 L404 812" stroke="#000" stroke-opacity=".35" stroke-width="4" />
  <path d="M578 584 L496 812" stroke="#000" stroke-opacity=".35" stroke-width="4" />
  <rect x="604" y="660" width="70" height="12" rx="6" fill="#000" opacity=".3" />

  <!-- shadow of the head on the torso -->
  <ellipse cx="450" cy="602" rx="168" ry="16" fill="#000" opacity=".3" />

  <!-- head -->
  <rect x="258" y="190" width="384" height="384" rx="96" fill="url(#skin)" />
  <rect x="258" y="190" width="384" height="190" rx="96" fill="url(#skinTop)" />
  <rect x="612" y="250" width="22" height="270" rx="11" fill="#b9805a" opacity=".22" />

  <!-- hair: blocky cap with a squared fringe -->
  <path fill="url(#hair)" d="M242 352 V250 Q242 118 372 104 H528 Q658 118 658 250 V352 H618 V272 H584 V312 H548 V268 H506 V300 H468 V264 H428 V304 H388 V268 H342 V312 H282 V352 Z" />
  <path fill="url(#hairShine)" d="M300 150 Q450 108 600 150 L596 172 Q450 134 304 172 Z" />
  <rect x="242" y="250" width="40" height="102" fill="#000" opacity=".12" />

  <!-- eyebrows -->
  <rect x="354" y="346" width="70" height="15" rx="7.5" fill="#2a1a11" transform="rotate(-4 389 353)" />
  <rect x="476" y="346" width="70" height="15" rx="7.5" fill="#2a1a11" transform="rotate(4 511 353)" />

  <!-- eyes -->
  <ellipse cx="389" cy="400" rx="15" ry="22" fill="#17120f" />
  <ellipse cx="511" cy="400" rx="15" ry="22" fill="#17120f" />
  <circle cx="394" cy="391" r="5" fill="#fff" />
  <circle cx="516" cy="391" r="5" fill="#fff" />

  <!-- classic smile -->
  <path d="M378 460 Q450 524 522 460" fill="none" stroke="#17120f" stroke-width="13" stroke-linecap="round" />
</svg>
